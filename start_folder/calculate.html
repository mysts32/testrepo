
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電卓 | Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/calculate.css">
    <script src="javascript/calculate.js" defer></script>
</head>

<body>

    <header>
        <h1>電卓</h1>

        <nav>
            <ul class="nav-list">
                <li><a href="index.html">ホーム</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
                <li><a href="work.html">課題</a></li>
                <li><a href="calculate.html">電卓</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="calculator">
            <h2>電卓</h2>

            <form id="calcForm">

                <div class="form-group">
                    <label for="value1">値1</label>
                    <input
                        type="number"
                        id="value1"
                        step="any"
                        placeholder="1つ目の数値を入力"
                    >
                </div>

                <div class="form-group">
                    <label for="value2">値2</label>
                    <input
                        type="number"
                        id="value2"
                        step="any"
                        placeholder="2つ目の数値を入力"
                    >
                </div>

                <div class="form-group">
                    <label for="choice">演算子</label>

                    <select id="choice">
                        <option value="">選択してください</option>
                        <option value="addition">足し算（＋）</option>
                        <option value="subtraction">引き算（－）</option>
                        <option value="multiplication">掛け算（×）</option>
                        <option value="division">割り算（÷）</option>
                    </select>
                </div>

            </form>

            <div class="result-area">
                <p id="formula">ここに計算式が表示されます</p>

                <p id="result">ここに計算結果が表示されます</p>
            </div>

        </section>
    </main>

</body>
</html>
